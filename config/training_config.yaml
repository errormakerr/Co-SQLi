# config.yaml

cuda_visible_devices: "0,1,2,3"
num_gpus: 4


token_select_pattern: "default"   # default / random / token_cleaning
data_prop: 1.0
random_seed: 42

batch_size_per_gpu: 2
gradient_accumulation_steps: 2
max_seq_length: 1024
num_train_epochs: 1
learning_rate: 1e-4
lr_scheduler_type: "linear"
warmup_ratio: 0.03
weight_decay: 0.0
checkpointing_steps: 25
logging_steps: 50
with_prompt_token: false

use_lora: true
lora_rank: 64
lora_alpha: 16
lora_dropout: 0.1
use_qlora: false

with_tracking: true
report_to: "tensorboard"

accelerate_config_file: "/home/linxiaotian/panhao/new_train_test/fsdp_config.yaml"
mixed_precision: "bf16"
main_process_port: 29522

merge:
  save_tokenizer: true
  use_fast_tokenizer: true
  qlora: false
