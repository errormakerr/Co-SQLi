# config.yaml

# 使用的 GPU 相关（可选）
cuda_visible_devices: "0,1,2,3"
num_gpus: 4

# 基座模型 & 数据
base_model: "/home/linxiaotian/llamafactory/LLaMA-Factory/model/Qwen/Qwen2.5-Coder-1.5B-Instruct"
train_file: "/home/linxiaotian/panhao/train_test/train_sqls.jsonl"

# 训练输出根目录
output_root: "/home/linxiaotian/llamafactory/LLaMA-Factory/model/test1/Qwen2.5-Coder-1.5B-Instruct_lora_test"

# token 相关策略
token_select_pattern: "default"   # default / random / token_cleaning
data_prop: 1.0
random_seed: 42

# 训练超参数
batch_size_per_gpu: 2
gradient_accumulation_steps: 2
max_seq_length: 1024
num_train_epochs: 1
learning_rate: 1e-4
lr_scheduler_type: "linear"
warmup_ratio: 0.03
weight_decay: 0.0
checkpointing_steps: 25
logging_steps: 50
with_prompt_token: false

# LoRA 配置
use_lora: true
lora_rank: 64
lora_alpha: 16
lora_dropout: 0.1
use_qlora: false           # 当前是全精度 LoRA，可留着做开关

# 训练监控
with_tracking: true
report_to: "tensorboard"

# accelerate 配置
accelerate_config_file: "/home/linxiaotian/panhao/new_train_test/fsdp_config.yaml"
mixed_precision: "bf16"
main_process_port: 29522

# merge 配置
merge:
  save_tokenizer: true
  use_fast_tokenizer: true
  qlora: false            # 如果以后改成 QLoRA，这里改成 true
